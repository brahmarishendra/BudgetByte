services:
  # PostgreSQL Database
  - type: pserv
    name: budgetbyte-db
    image:
      fromRegistry:
        name: postgres:16-alpine
    plan: free
    region: oregon
    envVars:
      - key: POSTGRES_DB
        value: budgetbyte
      - key: POSTGRES_USER
        value: budgetuser
      - key: POSTGRES_PASSWORD
        scope: project
        sync: false
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # Backend API (Java/Spring Boot)
  - type: webservice
    name: budgetbyte-backend
    plan: free
    region: oregon
    runtime: docker
    rootDir: Backend/BudgetByte/BudgetByte
    dockerfilePath: Dockerfile
    dockerBuildContext: .
    image:
      fromRegistry:
        name: brahmarishi/budgetbyte:backend-latest
    port: 8080
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: postgresql://budgetuser:${POSTGRES_PASSWORD}@budgetbyte-db:5432/budgetbyte
      - key: SPRING_DATASOURCE_USERNAME
        value: budgetuser
      - key: SPRING_DATASOURCE_PASSWORD
        scope: project
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheck:
      path: /actuator/health
      initialDelaySeconds: 30
      intervalSeconds: 10
      timeoutSeconds: 5
      maxFailedHealthChecks: 3
    autoDeploy: true
    buildFilter:
      paths:
        - Backend/BudgetByte/BudgetByte/**

  # Frontend (Vue SPA Static Site)
  - type: static
    name: budgetbyte-frontend
    rootDir: Frontend/Budget Tracking APP UI
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://budgetbyte.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://budgetbyte.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    buildFilter:
      paths:
        - "Frontend/Budget Tracking APP UI/**"

databases:
  - name: budgetbyte-db
    databaseName: budgetbyte
    user: budgetuser
    region: oregon
